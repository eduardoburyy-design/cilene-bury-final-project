
<!DOCTYPE html>

<style>

.btn-submit {

</head>

<body>

<div class="container">

<button class="logout" onclick="logout()">Sair</button>

<div class="header">Agendamento</div>

<form id="formAgendamento">

<div class="form-group">

<div class="form-group">
<select id="manicure pedicure">

</select>
</div>

<div class="form-group">
    <select id="cabelos">
    <option value=""> Selecione o procedimento</option>
    <option value="Corte">Corte R$45,00  </option>
    <option value="Escova + tintura">Escova + tintura R$119,99 VARIADO</option>
    <option value="Escova + chapinha">Escova + chapinha R$44,99 CURTO</option>
    <option value="Escova + chapinha"> Escova + chapinha R$69,99 MEDIO</option>
    <option value="Escova + chapinha"> Escova + chapinha R$79,99 GRANDE</option>

    <option value="Permante afro">Permante afro</option>
    </var></var>
    </option>
    
</div>

<div class="form-group">
<input type="date" id="data" required>
</div>

<div class="form-group">
<input type="time" id="hora" required>
</div>

<div class="form-group">
<textarea id="observacoes" placeholder="Observações"></textarea>
</div>

<button type="submit" class="btn-submit">Confirmar Agendamento</button>

</form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyBFxDYPxVZr02S04Cl5I9zO4CzBnXFOwR8",
authDomain: "salao-cilene-bury-ofc.firebaseapp.com",
projectId: "salao-cilene-bury-ofc",
storageBucket: "salao-cilene-bury-ofc.firebasestorage.app",
messagingSenderId: "731927606726",
appId: "1:731927606726:web:fbb6e6245e0f23a4d16ec7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
    if (!user) {
        alert("Faça login para acessar");
        window.location.href = "login.html";
    }
});

window.logout = function() {
    signOut(auth).then(() => {
        window.location.href = "login.html";
    });
};

document.getElementById("formAgendamento").addEventListener("submit", async function(e) {

e.preventDefault();

const nome = document.getElementById("nome").value;
const telefone = document.getElementById("telefone").value;
const procedimento = document.getElementById("procedimento").value;
const data = document.getElementById("data").value;
const hora = document.getElementById("hora").value;
const observacoes = document.getElementById("observacoes").value;

const q = query(
collection(db, "agendamentos"),
where("data","==",data),
where("hora","==",hora)
);

const querySnapshot = await getDocs(q);

if(!querySnapshot.empty){
alert("Esse horário já está ocupado");
return;
}

await addDoc(collection(db,"agendamentos"),{
nome,
telefone,
procedimento,
data,
hora,
observacoes,
criado:new Date()
});

const mensagem = `Olá, meu nome é ${nome} e gostaria de ser atendida.

📞 Telefone: ${telefone}
💅 Procedimento: ${procedimento}
📅 Data: ${data}
⏰ Hora: ${hora}
📝 Observações: ${observacoes}`;

const numero = "5511968239043";

window.open(`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`, "_blank");

alert("Agendamento realizado com sucesso!");
document.getElementById("formAgendamento").reset();

});
</script>

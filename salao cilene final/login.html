
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Salão Cilene Bury</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <h2>Login</h2>

        <input type="email" id="usuario" placeholder="Email">
        <input type="password" id="senha" placeholder="Senha">

        <button id="btnLogin">Entrar</button>

        <p id="erro"></p>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBFxDYPxVZr02S04Cl5I9zO4CzBnXFOwR8",
  authDomain: "salao-cilene-bury-ofc.firebaseapp.com",
  projectId: "salao-cilene-bury-ofc",
  storageBucket: "salao-cilene-bury-ofc.firebasestorage.app",
  messagingSenderId: "731927606726",
  appId: "1:731927606726:web:fbb6e6245e0f23a4d16ec7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("btnLogin").addEventListener("click", async () => {
    const email = document.getElementById("usuario").value;
    const senha = document.getElementById("senha").value;

    try {
        await signInWithEmailAndPassword(auth, email, senha);
        window.location.href = "agendar.html";
    } catch (error) {
        document.getElementById("erro").innerText = "Email ou senha incorretos";
        console.log(error);
    }
});
</script>

</body>
</html>

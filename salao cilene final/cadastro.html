
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Salão Cilene Bury</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="perfil-cliente" onclick="toggleMenu()">
    <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Perfil">

    <div class="info-cliente">
        <h3 id="nomeCliente">Cliente</h3>
        <p>Meu Perfil</p>
    </div>
</div>

<div class="menu-cliente" id="menuCliente">
    <h4>Histórico de Agendamentos</h4>
    <ul>
        <li>12/03 - Corte + Escova</li>
        <li>05/03 - Manicure</li>
        <li>27/02 - Hidratação</li>
    </ul>

    <button onclick="editarPerfil()">Editar Perfil</button>
</div>

<div class="login-container">
    <div class="login-box">
        <h2>Cadastro</h2>

        <input type="text" id="nome" placeholder="Nome completo">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="senha" placeholder="Senha">

        <button id="btnCadastro">Cadastrar</button>

        <p id="mensagem"></p>

        <br>
        <a href="login.html">Já tenho conta</a>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBFxDYPxVZr02S04Cl5I9zO4CzBnXFOwR8",
  authDomain: "salao-cilene-bury-ofc.firebaseapp.com",
  projectId: "salao-cilene-bury-ofc",
  storageBucket: "salao-cilene-bury-ofc.firebasestorage.app",
  messagingSenderId: "731927606726",
  appId: "1:731927606726:web:fbb6e6245e0f23a4d16ec7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("btnCadastro").addEventListener("click", async () => {
    const nome = document.getElementById("nome").value;
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    if (!nome || !email || !senha) {
        document.getElementById("mensagem").innerText = "Preencha todos os campos";
        return;
    }

    try {
        await createUserWithEmailAndPassword(auth, email, senha);
        document.getElementById("mensagem").innerText = "Cadastro realizado com sucesso ✅";

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1500);

    } catch (error) {
        document.getElementById("mensagem").innerText = error.message;
        console.log(error);
    }
});
</script> <script

</body>
</html>
